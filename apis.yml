name: Minimus
description: >-
  Minimus provides hardened, minimal container images designed for
  security-conscious teams. Its images are built from source with near-zero CVEs,
  rebuilt daily, and typically around 95% smaller than standard alternatives,
  with drop-in compatibility for existing workflows. Images ship audit-ready for
  compliance regimes including FedRAMP, NIST 800-190, FIPS 140-3, CIS, STIG, and
  SLSA L3, and the company is SOC 2 and ISO 27001 certified. The programmatic
  surface is the first-party minicli tool (manage private image recipes as code
  and trigger asynchronous builds), an open MinimOS apk package repository, and a
  generate-skills feature that makes the CLI agent-native for assistants such as
  Claude, Codex, and Cursor. Surfaced as a Mayfield portfolio company and
  enriched by the API Evangelist pipeline.
